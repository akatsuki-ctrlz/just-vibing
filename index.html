<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>反馈工具</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px;background:#f5f5f3;color:#1a1a1a;min-height:100vh;display:flex;justify-content:center;padding:2rem 1rem}
  .container{width:100%;max-width:800px}
  .top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem}
  .top-left{display:flex;align-items:center;gap:10px}
  .site-title{font-size:18px;font-weight:500}
  .site-badge{font-size:12px;color:#999;padding:3px 8px;border:0.5px solid #e0e0e0;border-radius:20px}
  .user-area{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .user-label{font-size:13px;color:#666}
  .user-name{font-size:13px;font-weight:500}
  .user-switch-btn{font-size:12px;color:#999;background:none;border:0.5px solid #e0e0e0;border-radius:6px;padding:4px 8px;cursor:pointer;font-family:inherit}
  .user-switch-btn:hover{background:#f0f0ee}
  .user-edit{display:none;align-items:center;gap:6px}
  .user-edit input{padding:5px 8px;border:0.5px solid #ccc;border-radius:6px;font-size:13px;font-family:inherit;background:#fff;color:#1a1a1a;outline:none;width:100px}
  .user-save-btn{font-size:12px;color:#3C3489;background:#EEEDFE;border:0.5px solid #534AB7;border-radius:6px;padding:4px 8px;cursor:pointer;font-family:inherit}
  .mode-row,.type-row{display:flex;gap:8px;margin-bottom:1.5rem}
  .mode-btn,.type-btn{flex:1;padding:10px;border:0.5px solid #ccc;border-radius:8px;background:#fff;color:#666;cursor:pointer;font-size:14px;font-family:inherit;transition:all .15s}
  .mode-btn.active,.type-btn.active{border-color:#534AB7;background:#EEEDFE;color:#3C3489;font-weight:500}
  .section{display:none}.section.show{display:block}
  .field label{display:block;font-size:13px;color:#666;margin-bottom:4px}
  .field-group-label{font-size:12px;color:#999;padding-bottom:4px;border-bottom:0.5px solid #e0e0e0;margin-bottom:8px}
  input[type=text],textarea{width:100%;padding:8px 10px;border:0.5px solid #ccc;border-radius:8px;font-size:14px;font-family:inherit;background:#fff;color:#1a1a1a;outline:none;transition:border-color .15s;box-sizing:border-box}
  input[type=text]:focus,textarea:focus{border-color:#534AB7;box-shadow:0 0 0 2px #EEEDFE}
  textarea{resize:vertical;min-height:60px}
  .seg-row{display:flex;gap:6px}
  .seg-btn{flex:1;padding:8px 4px;border:0.5px solid #ccc;border-radius:8px;background:#fff;color:#666;cursor:pointer;font-size:13px;font-family:inherit;transition:all .15s;text-align:center;white-space:nowrap}
  .seg-btn.active{border-color:#534AB7;background:#EEEDFE;color:#3C3489;font-weight:500}
  .pass-row{display:flex;gap:8px}
  .pass-btn{flex:1;padding:10px;border:0.5px solid #ccc;border-radius:8px;background:#fff;color:#666;cursor:pointer;font-size:14px;font-family:inherit;transition:all .15s}
  .pass-btn.pass.active{border-color:#0F6E56;background:#E1F5EE;color:#085041;font-weight:500}
  .pass-btn.fail.active{border-color:#993C1D;background:#FAECE7;color:#712B13;font-weight:500}
  .gen-btn{width:100%;padding:11px;border:0.5px solid #ccc;border-radius:8px;background:#fff;color:#1a1a1a;font-size:14px;font-family:inherit;cursor:pointer;margin-bottom:1.5rem;transition:background .15s}
  .gen-btn:hover{background:#f0f0ee}
  .output-wrap{display:none}.output-wrap.show{display:block}
  .output-box{background:#f0f0ee;border:0.5px solid #e0e0e0;border-radius:8px;padding:1rem 1.25rem;white-space:pre-wrap;font-size:14px;line-height:1.8;color:#1a1a1a;margin-bottom:10px}
  .copy-btn{display:flex;align-items:center;gap:6px;padding:9px 16px;border:0.5px solid #ccc;border-radius:8px;background:#fff;color:#1a1a1a;font-size:13px;font-family:inherit;cursor:pointer;transition:background .15s}
  .copy-btn:hover{background:#f0f0ee}
  .copy-btn.copied{color:#0F6E56;border-color:#0F6E56}
  .divider{border:none;border-top:0.5px solid #e0e0e0;margin:0 0 1.5rem}
  .hint{font-size:12px;color:#999}
  .fraction-row{display:flex;align-items:center;gap:6px}
  .fraction-row input{flex:1}
  .fraction-sep{font-size:16px;color:#666;flex-shrink:0}
  .fields-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:1.5rem}
  .score-auto{background:#f0f0ee !important}
  .vocab-row{margin-bottom:1.2rem}
  .vocab-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px;margin-bottom:1.5rem;align-items:start}
  .left-1{grid-column:1/2}
  .left-2{grid-column:2/3}
  .left-full{grid-column:1/3}
  .right-full{grid-column:3/5}
  .lesson-block{border:0.5px solid #e0e0e0;border-radius:8px;padding:12px;margin-bottom:10px}
  .lesson-block-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .lesson-block-title{font-size:12px;color:#999}
  .remove-btn{font-size:12px;color:#999;background:none;border:none;cursor:pointer;padding:2px 6px;border-radius:4px;font-family:inherit}
  .remove-btn:hover{color:#993C1D;background:#FAECE7}
  .lesson-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .add-lesson-btn{width:100%;padding:9px;border:0.5px dashed #ccc;border-radius:8px;background:transparent;color:#666;font-size:13px;font-family:inherit;cursor:pointer;margin-bottom:1.5rem}
  .add-lesson-btn:hover{background:#f0f0ee}
  .history-section{margin-top:.5rem}
  .history-title{font-size:13px;color:#666;margin-bottom:8px}
  .history-item{border:0.5px solid #e0e0e0;border-radius:8px;margin-bottom:8px;overflow:hidden}
  .history-header{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;cursor:pointer;background:#fff;font-size:13px;color:#666;user-select:none}
  .history-header:hover{background:#f0f0ee}
  .history-header-left{display:flex;align-items:center;gap:8px}
  .history-tag{font-size:11px;padding:2px 7px;border-radius:20px;background:#f0f0ee;color:#999;border:0.5px solid #e0e0e0}
  .history-preview{font-size:13px;color:#1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:300px}
  .history-chevron{font-size:12px;color:#999;transition:transform .2s}
  .history-body{display:none;padding:10px 12px 12px;border-top:0.5px solid #e0e0e0}
  .history-body.open{display:block}
  .history-text{white-space:pre-wrap;font-size:13px;line-height:1.8;color:#1a1a1a;margin-bottom:8px}
  .history-copy-btn{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border:0.5px solid #ccc;border-radius:8px;background:#fff;color:#1a1a1a;font-size:12px;font-family:inherit;cursor:pointer}
  .history-copy-btn:hover{background:#f0f0ee}
  .history-copy-btn.copied{color:#0F6E56;border-color:#0F6E56}
</style>
</head>
<body>
<div class="container">
  <div class="top-bar">
    <div class="top-left">
      <span class="site-title">反馈工具</span>
      <span class="site-badge">@Hide on Work</span>
    </div>
    <div class="user-area">
      <span class="user-label">当前用户：</span>
      <span class="user-name" id="user-display">陈晓瑜</span>
      <button class="user-switch-btn" onclick="toggleUserEdit()">切换用户</button>
      <div class="user-edit" id="user-edit">
        <input type="text" id="user-input" placeholder="输入姓名">
        <button class="user-save-btn" onclick="saveUser()">保存</button>
      </div>
    </div>
  </div>

  <div class="mode-row">
    <button class="mode-btn active" onclick="setMode('email')">邮件</button>
    <button class="mode-btn" onclick="setMode('vocab')">单词反馈</button>
  </div>

  <!-- 邮件模块 -->
  <div id="section-email" class="section show">
    <div class="type-row">
      <button class="type-btn active" onclick="setType('adjust')">课程调整</button>
      <button class="type-btn" onclick="setType('cancel')">课程取消</button>
      <button class="type-btn" onclick="setType('resume')">复课申请</button>
    </div>
    <div id="fields-adjust">
      <div class="fields-2" style="margin-bottom:12px">
        <div class="field"><label>学员姓名</label><input type="text" id="adj-name" placeholder="例：张三"></div>
        <div class="field"><label>调整原因</label><input type="text" id="adj-reason" placeholder="例：临时有事"></div>
      </div>
      <div id="adj-lessons"></div>
      <button class="add-lesson-btn" onclick="addLesson('adjust')">＋ 添加课程</button>
    </div>
    <div id="fields-cancel" style="display:none">
      <div class="fields-2" style="margin-bottom:12px">
        <div class="field"><label>学员姓名</label><input type="text" id="can-name" placeholder="例：张三"></div>
        <div class="field"><label>取消原因</label><input type="text" id="can-reason" placeholder="例：身体不适"></div>
      </div>
      <div id="can-lessons"></div>
      <button class="add-lesson-btn" onclick="addLesson('cancel')">＋ 添加课程</button>
    </div>
    <div id="fields-resume" style="display:none">
      <div class="fields-2" style="margin-bottom:12px">
        <div class="field"><label>学员姓名</label><input type="text" id="res-name" placeholder="例：张三"></div>
      </div>
      <div id="res-lessons"></div>
      <button class="add-lesson-btn" onclick="addLesson('resume')">＋ 添加课程</button>
    </div>
    <button class="gen-btn" onclick="generateEmail()">生成邮件正文</button>
    <div class="output-wrap" id="email-output-wrap">
      <hr class="divider">
      <div class="output-box" id="email-output-box"></div>
      <button class="copy-btn" id="email-copy-btn" onclick="copyAndClear('email')">复制正文</button>
    </div>
    <div class="history-section" id="email-history-section" style="display:none">
      <hr class="divider" style="margin-top:1rem">
      <div class="history-title">最近记录</div>
      <div id="email-history-list"></div>
    </div>
  </div>

  <!-- 单词反馈模块 -->
  <div id="section-vocab" class="section">
    <div class="vocab-grid">
      <div class="field left-1"><label>List</label><input type="text" id="v-lesson" placeholder="例：5"></div>
      <div class="field left-2"><label>听写总数</label><input type="text" id="v-total" placeholder="例：20" oninput="autoCalc()"></div>
      <div class="field right-full"><label>学员姓名</label><input type="text" id="v-name" placeholder="例：张三"></div>
      <div class="field left-full">
        <label>复习 / 新背</label>
        <div class="seg-row" id="v-review-row">
          <button class="seg-btn active" onclick="setReview('新背')">新背</button>
          <button class="seg-btn" onclick="setReview('复习')">复习</button>
        </div>
      </div>
      <div class="field right-full">
        <label>种类</label>
        <div class="seg-row" id="v-category-row">
          <button class="seg-btn active" data-val="托福" onclick="setCategory('托福')">托福</button>
          <button class="seg-btn" data-val="雅思" onclick="setCategory('雅思')">雅思</button>
          <button class="seg-btn" data-val="SAT" onclick="setCategory('SAT')">SAT</button>
          <button class="seg-btn" data-val="听力单词" onclick="setCategory('听力单词')">听力</button>
          <button class="seg-btn" data-val="阅读单词" onclick="setCategory('阅读单词')">阅读</button>
        </div>
      </div>
      <div class="field left-full">
        <label>第几遍 <span class="hint">（选填）</span></label>
        <input type="text" id="v-round" placeholder="例：2">
      </div>
      <div class="field right-full" id="book-fields">
        <label>书本名称</label>
        <div class="seg-row" id="v-book-row">
          <button class="seg-btn active" onclick="setBook('入门')">入门</button>
          <button class="seg-btn" onclick="setBook('预备')">预备</button>
          <button class="seg-btn" onclick="setBook('基础')">基础</button>
          <button class="seg-btn" onclick="setBook('核心')">核心</button>
          <button class="seg-btn" onclick="setBook('进阶')">进阶</button>
        </div>
      </div>
    </div>

    <div class="vocab-row">
      <div class="field"><label>辨音错词 <span class="hint">（空格分隔，无错词留空）</span></label>
        <input type="text" id="v-phon-err" placeholder="例：base desire" oninput="autoCalc()"></div>
    </div>
    <div class="vocab-row">
      <div class="field"><label>拼写错词 <span class="hint">（空格分隔，无错词留空）</span></label>
        <input type="text" id="v-spell-err" placeholder="例：course" oninput="autoCalc()"></div>
    </div>
    <div class="vocab-row">
      <div class="fields-2">
        <div class="field">
          <label style="font-size:12px;color:#999">辨音得分（自动）</label>
          <div class="fraction-row">
            <input type="text" id="v-phon-a" placeholder="—" class="score-auto" oninput="autoJudge()">
            <span class="fraction-sep">/</span>
            <input type="text" id="v-phon-b" placeholder="—" class="score-auto" oninput="autoJudge()">
          </div>
        </div>
        <div class="field">
          <label style="font-size:12px;color:#999">拼写得分（自动）</label>
          <div class="fraction-row">
            <input type="text" id="v-spell-a" placeholder="—" class="score-auto" oninput="autoJudge()">
            <span class="fraction-sep">/</span>
            <input type="text" id="v-spell-b" placeholder="—" class="score-auto" oninput="autoJudge()">
          </div>
        </div>
      </div>
    </div>
    <div class="vocab-row">
      <div class="field"><label>结果</label>
        <div class="pass-row">
          <button class="pass-btn pass" id="btn-pass" onclick="setPass(true)">通过 ✅</button>
          <button class="pass-btn fail" id="btn-fail" onclick="setPass(false)">不通过 ❌</button>
        </div>
      </div>
    </div>
    <button class="gen-btn" onclick="generateVocab()">生成反馈</button>
    <div class="output-wrap" id="vocab-output-wrap">
      <hr class="divider">
      <div class="output-box" id="vocab-output-box"></div>
      <button class="copy-btn" id="vocab-copy-btn" onclick="copyAndClear('vocab')">复制</button>
    </div>
    <div class="history-section" id="vocab-history-section" style="display:none">
      <hr class="divider" style="margin-top:1rem">
      <div class="history-title">最近记录</div>
      <div id="vocab-history-list"></div>
    </div>
  </div>
</div>

<script>
  let currentMode='email',emailType='adjust';
  let vCategory='托福',vBook='入门',vReview='新背',vPass=null;
  let emailHistory=[],vocabHistory=[];
  let adjLessons=[],canLessons=[],resLessons=[],lessonCounter=0;

  let currentUser=localStorage.getItem('feedback_user')||'陈晓瑜';
  document.getElementById('user-display').textContent=currentUser;

  function toggleUserEdit(){
    const area=document.getElementById('user-edit');
    const showing=area.style.display==='flex';
    area.style.display=showing?'none':'flex';
    if(!showing) document.getElementById('user-input').value=currentUser;
  }
  function saveUser(){
    const val=document.getElementById('user-input').value.trim();
    if(!val) return;
    currentUser=val;localStorage.setItem('feedback_user',val);
    document.getElementById('user-display').textContent=val;
    document.getElementById('user-edit').style.display='none';
  }
  function setMode(m){
    currentMode=m;
    document.querySelectorAll('.mode-btn').forEach((b,i)=>b.classList.toggle('active',['email','vocab'][i]===m));
    document.getElementById('section-email').classList.toggle('show',m==='email');
    document.getElementById('section-vocab').classList.toggle('show',m==='vocab');
  }
  function setType(t){
    emailType=t;
    document.querySelectorAll('#section-email .type-btn').forEach((b,i)=>b.classList.toggle('active',['adjust','cancel','resume'][i]===t));
    ['adjust','cancel','resume'].forEach(id=>document.getElementById('fields-'+id).style.display=id===t?'block':'none');
    document.getElementById('email-output-wrap').classList.remove('show');
  }
  function setCategory(c){
    vCategory=c;
    document.querySelectorAll('#v-category-row .seg-btn').forEach(b=>b.classList.toggle('active',b.dataset.val===c));
    document.getElementById('book-fields').style.display=(c==='听力单词'||c==='阅读单词')?'none':'block';
  }
  function setBook(b){vBook=b;document.querySelectorAll('#v-book-row .seg-btn').forEach(btn=>btn.classList.toggle('active',btn.textContent===b));}
  function setReview(r){vReview=r;document.querySelectorAll('#v-review-row .seg-btn').forEach(b=>b.classList.toggle('active',b.textContent===r));}
  function setPass(p){
    vPass=p;
    document.getElementById('btn-pass').classList.toggle('active',p===true);
    document.getElementById('btn-fail').classList.toggle('active',p===false);
  }
  function countWords(s){return s.trim()===''?0:s.trim().split(/\s+/).length;}
  function autoCalc(){
    const total=parseInt(document.getElementById('v-total').value);
    if(isNaN(total)||total<=0) return;
    const pe=countWords(document.getElementById('v-phon-err').value);
    const se=countWords(document.getElementById('v-spell-err').value);
    document.getElementById('v-phon-a').value=Math.max(0,total-pe);
    document.getElementById('v-phon-b').value=total;
    document.getElementById('v-spell-a').value=Math.max(0,total-se);
    document.getElementById('v-spell-b').value=total;
    autoJudge();
  }
  function autoJudge(){
    const pa=parseFloat(document.getElementById('v-phon-a').value);
    const pb=parseFloat(document.getElementById('v-phon-b').value);
    const sa=parseFloat(document.getElementById('v-spell-a').value);
    const sb=parseFloat(document.getElementById('v-spell-b').value);
    if(!isNaN(pa)&&!isNaN(pb)&&pb>0&&!isNaN(sa)&&!isNaN(sb)&&sb>0)
      setPass(pa/pb>=0.9&&sa/sb>=0.9);
  }
  function parseDatetime(raw){
    raw=raw.trim();
    const m=/^(\d+)([a-dA-D]?)$/.exec(raw);
    if(!m) return raw;
    const digits=m[1],letter=m[2];
    let d='';
    if(digits.length===1) d=digits+'月';
    else if(digits.length===2) d=digits[0]+'月'+digits[1]+'日';
    else if(digits.length===3) d=digits[0]+'月'+digits.slice(1)+'日';
    else if(digits.length===4) d=digits.slice(0,2)+'月'+digits.slice(2)+'日';
    else d=digits;
    return d+(letter?letter.toUpperCase()+'段':'');
  }
  function formatDateInput(input){
    const raw=input.value.trim();
    if(!raw) return;
    if(/^[a-dA-D]$/.test(raw)){input.value=raw.toUpperCase()+'段';return;}
    if(/^\d+[a-dA-D]?$/.test(raw)) input.value=parseDatetime(raw);
  }
  function parseResumeQuick(raw,id){
    const parts=raw.trim().split(/\s+/);
    if(parts.length<2) return;
    let dtPart='',teacherPart='',coursePart='';
    if(parts.length>=4&&/\d{1,2}:\d{2}/.test(parts[1])){
      dtPart=parseDatetime(parts[0])+parts[1];teacherPart=parts[2];coursePart=parts.slice(3).join('');
    } else {
      dtPart=parseDatetime(parts[0]);teacherPart=parts[1]||'';coursePart=parts.slice(2).join('');
    }
    const dtEl=document.getElementById('l-'+id+'-dt');
    const tEl=document.getElementById('l-'+id+'-teacher');
    const cEl=document.getElementById('l-'+id+'-course');
    if(dtEl) dtEl.value=dtPart;
    if(tEl) tEl.value=teacherPart;
    if(cEl) cEl.value=coursePart;
  }
  function makeLessonBlock(type,id){
    const isAdj=type==='adjust',isRes=type==='resume';
    let html=`<div class="lesson-block" id="lesson-${id}">
      <div class="lesson-block-header">
        <span class="lesson-block-title">第 <span id="lesson-num-${id}">—</span> 节</span>
        <button class="remove-btn" onclick="removeLesson('${type}',${id})">✕ 删除</button>
      </div>`;
    if(isRes){
      html+=`<div class="lesson-grid">
        <div class="field" style="grid-column:1/-1"><label>快速输入 <span class="hint">（日期时间段 老师 课程）</span></label><input type="text" id="l-${id}-quick" placeholder="例：622d 张三 托福口语" oninput="parseResumeQuick(this.value,${id})"></div>
        <div class="field" style="grid-column:1/-1"><label>日期及时间段</label><input type="text" id="l-${id}-dt" placeholder="例：6月22日B段" onblur="formatDateInput(this)"></div>
        <div class="field"><label>老师</label><input type="text" id="l-${id}-teacher" placeholder="例：张三"></div>
        <div class="field"><label>课程</label><input type="text" id="l-${id}-course" placeholder="例：托福口语"></div>
      </div>`;
    } else {
      html+=`<div class="lesson-grid">
        ${isAdj?'<div class="field-group-label" style="grid-column:1/-1">原课</div>':''}
        <div class="field" style="grid-column:1/-1"><label>日期及时间段</label><input type="text" id="l-${id}-dt" placeholder="例：612d → 6月12日D段" onblur="formatDateInput(this)"></div>
        <div class="field"><label>老师</label><input type="text" id="l-${id}-teacher" placeholder="例：张三"></div>
        <div class="field"><label>课程</label><input type="text" id="l-${id}-course" placeholder="例：托福阅读课"></div>
        ${isAdj?`<div class="field-group-label" style="grid-column:1/-1">调整至</div>
        <div class="field" style="grid-column:1/-1"><label>日期及时间段</label><input type="text" id="l-${id}-todt" placeholder="例：613b → 6月13日B段" onblur="formatDateInput(this)"></div>`:''}
      </div>`;
    }
    html+='</div>';
    return html;
  }
  function addLesson(type){
    const id=++lessonCounter;
    if(type==='adjust') adjLessons.push(id);
    else if(type==='cancel') canLessons.push(id);
    else resLessons.push(id);
    const cid=type==='adjust'?'adj-lessons':type==='cancel'?'can-lessons':'res-lessons';
    const div=document.createElement('div');
    div.innerHTML=makeLessonBlock(type,id);
    document.getElementById(cid).appendChild(div.firstChild);
    updateLessonNumbers(type);
  }
  function removeLesson(type,id){
    const arr=type==='adjust'?adjLessons:type==='cancel'?canLessons:resLessons;
    const idx=arr.indexOf(id);
    if(idx>-1) arr.splice(idx,1);
    document.getElementById('lesson-'+id)?.remove();
    updateLessonNumbers(type);
  }
  function updateLessonNumbers(type){
    const arr=type==='adjust'?adjLessons:type==='cancel'?canLessons:resLessons;
    arr.forEach((id,i)=>{const el=document.getElementById('lesson-num-'+id);if(el) el.textContent=i+1;});
  }
  function gv(id){return(document.getElementById(id)?.value||'______').trim();}
  function addTeacher(n){if(!n||n==='______') return n;return n.endsWith('老师')?n:n+'老师';}
  function v(id){return(document.getElementById(id)?.value||'').trim();}
  function generateEmail(){
    let text='';
    if(emailType==='adjust'){
      const name=gv('adj-name'),reason=gv('adj-reason');
      const lines=adjLessons.map(id=>`${gv('l-'+id+'-dt')}${addTeacher(gv('l-'+id+'-teacher'))}${gv('l-'+id+'-course')}至${gv('l-'+id+'-todt')}`);
      const c=lines.length===1?`调整内容：申请调整${lines[0]}`:`调整内容：申请调整：\n${lines.join('\n')}`;
      text=`教务老师好，\n以下为学员${name}的课程调整申请，辛苦操作！\n\n学员姓名：${name}\n调整原因：${reason}\n${c}\n课时补扣：不扣不补\n\n祝好，\n${currentUser}`;
    } else if(emailType==='cancel'){
      const name=gv('can-name'),reason=gv('can-reason');
      const lines=canLessons.map(id=>`${gv('l-'+id+'-dt')}${addTeacher(gv('l-'+id+'-teacher'))}${gv('l-'+id+'-course')}`);
      const c=lines.length===1?`取消内容：申请取消${lines[0]}`:`取消内容：申请取消：\n${lines.join('\n')}`;
      text=`教务老师好，\n以下为学员${name}的课程取消申请，辛苦操作！\n\n学员姓名：${name}\n取消原因：${reason}\n${c}\n课时补扣：不扣不补\n\n祝好，\n${currentUser}`;
    } else {
      const name=gv('res-name');
      const lines=resLessons.map(id=>`${gv('l-'+id+'-dt')}${addTeacher(gv('l-'+id+'-teacher'))}${gv('l-'+id+'-course')}`);
      text=`教务老师好，\n以下为学员${name}的复课申请，辛苦操作！\n\n学员复课细节如下：\n${lines.length===1?lines[0]:lines.join('\n')}\n\n祝好，\n${currentUser}`;
    }
    document.getElementById('email-output-box').textContent=text;
    document.getElementById('email-output-wrap').classList.add('show');
    const btn=document.getElementById('email-copy-btn');
    btn.classList.remove('copied');btn.textContent='复制正文';
  }
  function generateVocab(){
    const noBook=vCategory==='听力单词'||vCategory==='阅读单词';
    const lessonNum=v('v-lesson');
    const bookPart=noBook?'':vBook+(lessonNum?'L'+lessonNum:'');
    const roundPart=v('v-round')?` 第${v('v-round')}遍`:'';
    const name=v('v-name')||'______';
    const phonA=v('v-phon-a')||'___',phonB=v('v-phon-b')||'___';
    const spellA=v('v-spell-a')||'___',spellB=v('v-spell-b')||'___';
    const phonErr=v('v-phon-err'),spellErr=v('v-spell-err');
    const passText=vPass===true?'通过✅':vPass===false?'不通过❌':'______';
    let phonLine=`辨音：${phonA}/${phonB}`;
    if(phonErr) phonLine+='\n'+phonErr.trim().split(/\s+/).join('\n');
    let spellLine=`拼写：${spellA}/${spellB}`;
    if(spellErr) spellLine+='\n'+spellErr.trim().split(/\s+/).join('\n');
    const text=`${name} ${vCategory}${bookPart}${vReview}${roundPart}\n${phonLine}\n${spellLine}\n${passText}`;
    document.getElementById('vocab-output-box').textContent=text;
    document.getElementById('vocab-output-wrap').classList.add('show');
    const btn=document.getElementById('vocab-copy-btn');
    btn.classList.remove('copied');btn.textContent='复制';
  }
  function copyAndClear(type){
    const text=document.getElementById(type+'-output-box').textContent;
    navigator.clipboard.writeText(text).then(()=>{
      const btn=document.getElementById(type+'-copy-btn');
      btn.classList.add('copied');btn.textContent='已复制 ✓';
      const hist=type==='email'?emailHistory:vocabHistory;
      hist.unshift(text);if(hist.length>3) hist.pop();
      if(type==='email') emailHistory=hist; else vocabHistory=hist;
      renderHistory(type);
      setTimeout(()=>{clearFields(type);document.getElementById(type+'-output-wrap').classList.remove('show');},800);
    });
  }
  function clearFields(type){
    if(type==='email'){
      ['adj-name','adj-reason','can-name','can-reason','res-name'].forEach(id=>{const el=document.getElementById(id);if(el) el.value='';});
      adjLessons=[];canLessons=[];resLessons=[];
      ['adj-lessons','can-lessons','res-lessons'].forEach(id=>document.getElementById(id).innerHTML='');
      addLesson('adjust');addLesson('cancel');addLesson('resume');
    } else {
      ['v-name','v-lesson','v-round','v-total','v-phon-err','v-spell-err','v-phon-a','v-phon-b','v-spell-a','v-spell-b']
        .forEach(id=>document.getElementById(id).value='');
      vPass=null;
      document.getElementById('btn-pass').classList.remove('active');
      document.getElementById('btn-fail').classList.remove('active');
    }
  }
  function renderHistory(type){
    const hist=type==='email'?emailHistory:vocabHistory;
    const section=document.getElementById(type+'-history-section');
    const list=document.getElementById(type+'-history-list');
    if(!hist.length){section.style.display='none';return;}
    section.style.display='block';
    list.innerHTML=hist.map((text,i)=>{
      const preview=text.split('\n')[0];
      const tag=type==='email'?'邮件':'单词';
      return `<div class="history-item">
        <div class="history-header" onclick="toggleHistory(this)">
          <div class="history-header-left"><span class="history-tag">${tag}</span><span class="history-preview">${preview}</span></div>
          <span class="history-chevron">▼</span>
        </div>
        <div class="history-body">
          <div class="history-text">${text}</div>
          <button class="history-copy-btn" onclick="copyHistoryItem(this,${i},'${type}')">复制</button>
        </div>
      </div>`;
    }).join('');
  }
  function toggleHistory(header){
    const body=header.nextElementSibling;
    const chevron=header.querySelector('.history-chevron');
    const isOpen=body.classList.contains('open');
    body.classList.toggle('open',!isOpen);
    chevron.style.transform=isOpen?'':'rotate(180deg)';
  }
  function copyHistoryItem(btn,index,type){
    const hist=type==='email'?emailHistory:vocabHistory;
    navigator.clipboard.writeText(hist[index]).then(()=>{
      btn.classList.add('copied');btn.textContent='已复制 ✓';
      setTimeout(()=>{btn.classList.remove('copied');btn.textContent='复制';},2000);
    });
  }
  addLesson('adjust');addLesson('cancel');addLesson('resume');
</script>
</body>
</html>
